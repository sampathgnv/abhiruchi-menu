<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abhiruchi Sweets — menu data</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    max-width: 34rem;
    margin: 0 auto;
    padding: 3rem 1.25rem;
    background: #fdf6dc;
    color: #241634;
  }
  h1 { color: #4a1e7a; font-size: 1.5rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 2rem; color: #6b5b4e; }
  a { color: #4a1e7a; }
  code {
    background: #f5e9c4; padding: .1rem .35rem; border-radius: 4px;
    font-family: ui-monospace, Consolas, monospace; font-size: .9em;
  }
  .card {
    background: #fff; border: 1px solid #e6dbbb; border-radius: 10px;
    padding: 1rem 1.25rem; margin-bottom: 1rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16101f; color: #f3ead8; }
    h1 { color: #c7a6f2; }
    p.sub { color: #b0a08f; }
    a { color: #c7a6f2; }
    code { background: #2a1f3d; }
    .card { background: #201730; border-color: #362848; }
  }
</style>
</head>
<body>
  <h1>Abhiruchi Sweets</h1>
  <p class="sub">Menu data for the Android app.</p>

  <div class="card">
    <p>
      This address serves the price list that the Abhiruchi Sweets app reads. It is not a shop
      page — to see the menu, order sweets, or find our stores, please use the app or visit
      <a href="https://www.abhiruchisweets.in/">abhiruchisweets.in</a>.
    </p>
  </div>

  <div class="card">
    <p>The data itself is at <a href="catalog.json"><code>catalog.json</code></a>.</p>
  </div>
</body>
</html>
